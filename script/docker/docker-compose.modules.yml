    image: ruoyi-snailjob-server:6.0.0
    container_name: ruoyi-snailjob-server
    command: ["java", "-jar", "/app/app.jar",
      "--spring.cloud.nacos.server-addr=ruoyi-nacos:8848",
      "--spring.cloud.nacos.discovery.server-addr=ruoyi-nacos:8848",
      "--spring.cloud.nacos.config.server-addr=ruoyi-nacos:8848"]
    networks:
      - ruoyi-net
    restart: unless-stopped

  ruoyi-snailai-server:
    build:
      context: ../..
      dockerfile: script/docker/app.Dockerfile
      args:
        JAR_PATH: ruoyi-visual/ruoyi-snailai-server/target/ruoyi-snailai-server.jar
    image: ruoyi-snailai-server:6.0.0
    container_name: ruoyi-snailai-server
